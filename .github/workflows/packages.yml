name: Build Debian packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.architecture }} package
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rust:trixie

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            dpkg-dev libgtk-4-dev make pkg-config

      - name: Build Debian package
        env:
          DEB_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make deb CARGO=cargo
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: bbcat-gnome-deb-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish Debian packages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bbcat-gnome-deb-*
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Update tip prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated bbcat-gnome packages for commit \`$GITHUB_SHA\`."
          if gh release view tip --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/tip" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit tip --repo "$GITHUB_REPOSITORY" \
              --title "Tip build" --prerelease --notes "$notes"
          else
            gh release create tip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Tip build" \
              --prerelease --notes "$notes"
          fi

          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/tip" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name | endswith(".deb")) | .id' |
            while read -r asset_id; do
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done

          gh release upload tip dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --clobber
